[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-source-security-checker"
version = "0.2.0"
description = "Local checks for password strength and HTML form security."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Marwane El Fadily" }]

[project.scripts]
security-checker = "security_checker.cli:main"

[tool.setuptools.packages.find]
include = ["security_checker*"]

[tool.setuptools.package-data]
"security_checker.data" = ["*.txt"]
